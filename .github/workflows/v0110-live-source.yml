name: Live-check v0.1.10 source routing

on:
  push:
    branches:
      - fix/v0110-search-playback-fallback
    paths:
      - .github/workflows/v0110-live-source.yml

permissions:
  contents: read

jobs:
  live-source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/v0110-search-playback-fallback
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v6
        with:
          node-version: 22.14.0
          package-manager-cache: false
      - name: Start production-profile Lavalink
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 2 \
            https://github.com/lavalink-devs/Lavalink/releases/download/4.2.2/Lavalink.jar \
            -o lavalink/Lavalink.jar
          echo '8cb801e591072c3689fafd71ccf571a95a4ead3cc35dfc045e157d763d89119a  lavalink/Lavalink.jar' | sha256sum -c -
          cd lavalink
          java -Xms64M -Xmx256M -jar Lavalink.jar > ../lavalink-v0110.log 2>&1 &
          echo $! > ../lavalink-v0110.pid
          cd ..
          ready=0
          for attempt in {1..90}; do
            if curl -fsS -H 'Authorization: ezmusic-local-only' http://127.0.0.1:2333/version >/dev/null; then ready=1; break; fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then tail -n 200 lavalink-v0110.log >&2 || true; exit 1; fi
      - name: Validate exact reported route and live fallback candidate
        run: |
          node --input-type=module <<'NODE'
          import { resolvePreferredSearch } from './src/source-routing.js';
          import { chooseSoundCloudAlternative, playbackFallbackQuery } from './src/playback-fallback.js';

          async function load(identifier) {
            const url = new URL('http://127.0.0.1:2333/v4/loadtracks');
            url.searchParams.set('identifier', identifier);
            const response = await fetch(url, { headers: { Authorization: 'ezmusic-local-only' } });
            if (!response.ok) throw new Error(`Lavalink ${response.status}`);
            return response.json();
          }
          const calls = [];
          const target = {
            async search(query, options = {}) {
              const identifier = options.source ? `${options.source}${query}` : query;
              calls.push(identifier);
              const body = await load(identifier);
              const raw = body.loadType === 'search' ? body.data : body.loadType === 'track' ? [body.data] : [];
              return { type: body.loadType === 'search' ? 'SEARCH' : body.loadType?.toUpperCase?.() || 'EMPTY', tracks: raw.map((item) => ({ ...(item.info || {}), encoded: item.encoded })) };
            },
          };

          const selected = (await resolvePreferredSearch(target, 'Heavy Serenade', null))?.tracks?.[0];
          if (!selected || !/nmixx|jyp/i.test(`${selected.title || ''} ${selected.author || ''}`)) {
            throw new Error(`Wrong primary selection: ${selected?.title} — ${selected?.author}`);
          }
          if (calls[0] !== 'ytmsearch:Heavy Serenade' || calls[1] !== 'ytsearch:Heavy Serenade') {
            throw new Error(`Expected YTM -> YouTube ambiguity comparison, got ${calls.join(' -> ')}`);
          }
          console.log(`primary: ${selected.title} — ${selected.author} — ${selected.uri}`);

          const youtube = await load(selected.uri);
          if (youtube.loadType !== 'error') throw new Error(`Expected current credential-free YouTube block, got ${youtube.loadType}`);
          console.log('primary YouTube direct load is currently blocked by upstream login/SABR behavior.');

          const fallbackQuery = playbackFallbackQuery(selected);
          const scBody = await load(`scsearch:${fallbackQuery}`);
          const scTracks = scBody.loadType === 'search' ? scBody.data.map((item) => ({ ...(item.info || {}), encoded: item.encoded })) : [];
          const alternative = chooseSoundCloudAlternative(fallbackQuery, scTracks, selected);
          if (!alternative) throw new Error(`No relevance-checked SoundCloud alternative for ${fallbackQuery}`);
          if (/remix|karaoke|instrumental|cover/i.test(`${alternative.title || ''} ${alternative.author || ''}`)) {
            throw new Error(`Variant fallback escaped filtering: ${alternative.title} — ${alternative.author}`);
          }
          console.log(`fallback: ${alternative.title} — ${alternative.author} — ${alternative.uri}`);

          const directSc = await load(alternative.uri);
          if (directSc.loadType !== 'track') {
            throw new Error(`SoundCloud candidate does not direct-load as a track: ${directSc.loadType}`);
          }
          if (directSc.data?.info?.sourceName !== 'soundcloud') {
            throw new Error(`Unexpected fallback source: ${directSc.data?.info?.sourceName}`);
          }
          console.log('SoundCloud fallback direct-load succeeded.');
          NODE
      - name: Stop Lavalink
        if: always()
        run: |
          if [ -f lavalink-v0110.pid ]; then kill "$(cat lavalink-v0110.pid)" 2>/dev/null || true; fi
      - name: Show log on failure
        if: failure()
        run: tail -n 160 lavalink-v0110.log || true
