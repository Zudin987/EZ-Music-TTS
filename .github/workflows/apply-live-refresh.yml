name: Apply live JukeBox refresh

on:
  push:
    branches:
      - feature/live-jukebox-refresh
    paths:
      - .github/workflows/apply-live-refresh.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/live-jukebox-refresh
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: '22.14.0'
          package-manager-cache: false

      - name: Apply live refresh implementation
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/fix-live-refresh-patcher.py
          python3 .github/apply-live-refresh.py

      - name: Validate implementation
        shell: bash
        run: |
          set -euo pipefail
          npm install
          npm run check
          npm test

      - name: Commit implementation and remove staging files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "MrEz"
          git config user.email "39240221+Zudin987@users.noreply.github.com"
          git add src/commands.js src/live-panel.js test/live-panel.test.js package.json README.md
          git rm -f .github/workflows/apply-live-refresh.yml .github/apply-live-refresh.py .github/fix-live-refresh-patcher.py
          git commit -m "feat: auto-refresh private JukeBox player"
          git push origin HEAD:feature/live-jukebox-refresh

