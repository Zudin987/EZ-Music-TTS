name: Publish EZ Music v0.1.6

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/release-v0.1.6.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: 710ce8437d66158e4eaa1b4c6d90e4eeded36610

      - name: Verify release source
        shell: bash
        run: |
          set -euo pipefail
          test "$(node -p "require('./package.json').version")" = "0.1.6"
          test -f src/performance.js
          test -f test/performance-v016.test.js
          grep -q 'emptyVoiceAutoPaused = new Set' src/music.js
          grep -q "Auto-paused (empty VC)" src/commands.js
          grep -q 'bufferDurationMs: 2000' lavalink/application.yml
          grep -q 'frameBufferDurationMs: 20000' lavalink/application.yml
          grep -q 'nonAllocatingFrameBuffer: true' lavalink/application.yml
          grep -q '^      - MUSIC$' lavalink/application.yml
          grep -q '^      - ANDROID_VR$' lavalink/application.yml
          grep -q '^      - WEB$' lavalink/application.yml
          grep -q '^      - WEBEMBEDDED$' lavalink/application.yml
          ! grep -q '^      - IOS$' lavalink/application.yml
          ! grep -q '^      - TVHTML5_SIMPLY$' lavalink/application.yml
          grep -q -- '-Xmx256M' start-bot.bat
          grep -q -- '--max-old-space-size=128' start-bot.bat

      - name: Build clean Windows install ZIP
        shell: bash
        run: |
          set -euo pipefail
          VERSION="v0.1.6"
          ROOT="dist/EZ-Music"
          mkdir -p "$ROOT/src" "$ROOT/lavalink"

          cp README.md package.json .env.example setup.bat start-bot.bat start-hidden.vbs stop-bot.bat install-autostart.bat install-autostart.ps1 remove-autostart.bat "$ROOT/"
          cp src/*.js "$ROOT/src/"
          cp lavalink/application.yml "$ROOT/lavalink/"

          cat > "$ROOT/CLEAN-INSTALL.txt" <<'EOF'
          EZ MUSIC v0.1.6 CLEAN WINDOWS INSTALL
          ====================================
          1. Stop EZ Music.
          2. Back up C:\EZ-Music\.env.
          3. If you want to preserve volume, favorites, history and crash/restart recovery,
             also back up C:\EZ-Music\data\ez-music.sqlite.
          4. Remove or rename the old C:\EZ-Music folder for a truly clean install.
          5. Extract this ZIP so the app lives at C:\EZ-Music.
          6. Restore your backed-up .env to C:\EZ-Music\.env.
          7. Restore data\ez-music.sqlite only if you intentionally backed it up.
          8. Run setup.bat.
          9. Test with start-bot.bat.
          10. When satisfied, use start-hidden.vbs; reinstall Task Scheduler only if needed.

          PERFORMANCE CHANGES
          -------------------
          - Active playback pauses immediately when the last human leaves the bot's voice
            channel. If a human returns within the existing 2-minute grace period, EZ Music
            resumes only if EZ Music created that pause. A manual /pause stays paused.
          - If the room remains empty for 2 minutes, the existing disconnect/reset cleanup
            still runs.
          - YouTube client order is shortened to MUSIC (search only), ANDROID_VR, WEB,
            WEBEMBEDDED. This follows the current youtube-source example and keeps playback
            fallbacks Opus-capable while avoiding known problematic/transcoding-prone early
            clients.
          - /status adds a lightweight voice-transport quality label and explicitly reports
            Auto-paused (empty VC) when applicable.

          STABILITY / MEMORY POLICY UNCHANGED
          -----------------------------------
          Lavalink remains capped at 256 MB Java heap and Node at 128 MB heap. Buffering
          remains 2s NAS / 20s frame buffer with nonAllocatingFrameBuffer enabled. Queue
          limits remain 300 upcoming / 250 per playlist. DSP remains disabled except normal
          volume. SQLite remains the only persistence service. YTM-first search, normal
          YouTube fallback, source circuit breaker, recovery, optional Spotify mirroring,
          generic HTTP/local source blocking, and native Windows operation remain unchanged.

          This package intentionally contains no .env, real secrets, SQLite database,
          node_modules, logs, or Lavalink.jar. setup.bat installs/downloads required runtime
          files. No Docker, WSL, Redis, PostgreSQL, RabbitMQ, web dashboard, extra daemon,
          DSP effect, or increased RAM cap was added.
          EOF

          cd dist
          zip -r -9 "EZ-Music-${VERSION}-Windows-Clean.zip" EZ-Music >/dev/null
          sha256sum "EZ-Music-${VERSION}-Windows-Clean.zip" > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v0.1.6 >/dev/null 2>&1; then
            echo "Release v0.1.6 already exists; leaving it unchanged."
          else
            gh release create v0.1.6 \
              dist/EZ-Music-v0.1.6-Windows-Clean.zip \
              dist/SHA256SUMS.txt \
              --target 710ce8437d66158e4eaa1b4c6d90e4eeded36610 \
              --title "EZ Music v0.1.6" \
              --notes "Performance-focused release. EZ Music now immediately auto-pauses active playback when the last human leaves its voice channel and auto-resumes only that bot-created pause when a listener returns within the existing 2-minute grace window; manual /pause is never auto-resumed. The youtube-source client chain is shortened to the current upstream example (MUSIC search-only -> ANDROID_VR -> WEB -> WEBEMBEDDED), avoiding regular ANDROID, IOS and the previously failing TVHTML5_SIMPLY path before playback. /status now labels voice transport quality and reports Auto-paused (empty VC). The 2s/20s buffering profile, non-allocating frame buffer, 256 MB Lavalink heap cap, 128 MB Node heap cap, one Lavalink + one Node architecture, SQLite persistence, 300/250 queue caps, DSP-off policy, YTM-first routing, normal YouTube fallback, recovery and source circuit breaker are unchanged. PR #8 and post-merge main CI passed on Windows and Ubuntu, including the standalone Lavalink + YouTube/LavaSrc YTM/YouTube smoke test."
          fi

      - name: Remove merged feature branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin --delete perf/v016-empty-voice-clients-status || true
