name: Verify v0.1.12 ghost playback fix

on:
  push:
    branches:
      - fix/v0112-ghost-playback-start
    paths:
      - .github/workflows/v0112-verify.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/v0112-ghost-playback-start
      - uses: actions/setup-node@v6
        with:
          node-version: 22.14.0
          package-manager-cache: false
      - name: Apply focused product patch
        run: node scripts/apply-v0112-ghost-playback.mjs
      - name: Locked clean install
        run: npm ci
      - name: Syntax checks
        run: npm run check
      - name: Full regression suite
        run: npm test
      - name: Preserve playback profile
        run: |
          set -euo pipefail
          grep -q 'bufferDurationMs: 2000' lavalink/application.yml
          grep -q 'frameBufferDurationMs: 20000' lavalink/application.yml
          grep -q 'nonAllocatingFrameBuffer: true' lavalink/application.yml
          grep -q -- '-Xmx256M' start-bot.bat
          grep -q -- '--max-old-space-size=128' start-bot.bat
      - name: Commit verified product changes
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md package.json package-lock.json src/playback-start.js src/commands.js test/source-routing.test.js test/playback-start-v0112.test.js
          git commit -m "fix: prevent ghost current playback state"
          git push origin HEAD:fix/v0112-ghost-playback-start
