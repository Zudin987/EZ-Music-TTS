name: Refresh v0.1.7 Lockfile

on:
  push:
    branches:
      - audit/v017-hardening
    paths:
      - .github/workflows/refresh-lock-v017.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: audit/v017-hardening
      - uses: actions/setup-node@v6
        with:
          node-version: '22.14.0'
          package-manager-cache: false
      - name: Refresh lockfile
        run: npm install --package-lock-only --ignore-scripts
      - name: Verify locked install
        run: npm ci
      - name: Commit lockfile only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m 'chore: lock Windows-safe SQLite dependency'
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin HEAD:audit/v017-hardening
