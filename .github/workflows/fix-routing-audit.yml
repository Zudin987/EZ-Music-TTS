name: Apply routing audit fixes

on:
  push:
    branches:
      - feature/ytm-spotify-routing
    paths:
      - .github/fix-routing-audit.py
      - .github/workflows/fix-routing-audit.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/ytm-spotify-routing
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '22.14.0'
          package-manager-cache: false
      - name: Apply audit fixes
        run: python3 .github/fix-routing-audit.py
      - name: Validate
        run: |
          npm install
          npm run check
          npm test
      - name: Commit fixes and remove staging files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "MrEz"
          git config user.email "39240221+Zudin987@users.noreply.github.com"
          git add src/music.js test/source-routing.test.js README.md
          git rm -f .github/fix-routing-audit.py .github/workflows/fix-routing-audit.yml
          git commit -m "fix: harden Spotify URL routing"
          git push origin HEAD:feature/ytm-spotify-routing
