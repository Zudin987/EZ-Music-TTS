name: Apply Jukebox Components V2

on:
  push:
    branches:
      - feature/jukebox-components-v2

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/jukebox-components-v2

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Apply Components V2 jukebox patch
        shell: python
        run: |
          from pathlib import Path
          import re

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, got {count}')
              return text.replace(old, new, 1)

          # ---------- src/ui.js ----------
          path = Path('src/ui.js')
          ui = path.read_text(encoding='utf-8')

          old_import = """import {
            ActionRowBuilder,
            ButtonBuilder,
            ButtonStyle,
            EmbedBuilder,
            ModalBuilder,
            StringSelectMenuBuilder,
            TextInputBuilder,
            TextInputStyle,
            escapeMarkdown,
          } from 'discord.js';"""
          new_import = """import {
            ActionRowBuilder,
            ButtonBuilder,
            ButtonStyle,
            ContainerBuilder,
            EmbedBuilder,
            MessageFlags,
            ModalBuilder,
            SectionBuilder,
            SeparatorBuilder,
            StringSelectMenuBuilder,
            TextDisplayBuilder,
            TextInputBuilder,
            TextInputStyle,
            ThumbnailBuilder,
            escapeMarkdown,
          } from 'discord.js';"""
          ui = replace_once(ui, old_import, new_import, 'ui import block')

          ui = replace_once(
              ui,
              "const LIBRARY_PAGE_SIZE = 20;",
              "const LIBRARY_PAGE_SIZE = 20;\nconst JUKEBOX_ACCENT = 0x4CC2FF;",
              'jukebox accent',
          )

          marker = "export function playerButtons(player, autoplayMode = 'off', { canUndo = false } = {}) {"
          helpers = r"""
          function componentsV2Payload(container) {
            return {
              content: null,
              embeds: [],
              flags: MessageFlags.IsComponentsV2,
              components: [container],
            };
          }

          function addRows(container, rows) {
            for (const row of rows || []) container.addActionRowComponents(row);
            return container;
          }

          function textContainerPayload(lines, rows = [], accent = JUKEBOX_ACCENT) {
            const text = Array.isArray(lines) ? lines.join('\n') : String(lines || '');
            const container = new ContainerBuilder().setAccentColor(accent);
            if (text) container.addTextDisplayComponents(new TextDisplayBuilder().setContent(text));
            if (rows.length) container.addSeparatorComponents(new SeparatorBuilder().setDivider(true));
            addRows(container, rows);
            return componentsV2Payload(container);
          }

          function trackContainerPayload(track, player, autoplayMode, rows, { heading = '🎵 Now Playing', notice = null } = {}) {
            const requester = track?.requester?.displayName || track?.requester?.globalName || track?.requester?.username || 'Unknown';
            const title = safeText(track?.title || 'Unknown title', 220);
            const uri = safeHttpUrl(track?.uri || track?.realUri);
            const next = player?.queue?.[0];
            const queueCount = Number(player?.queue?.length || 0);
            const queueDuration = Number(player?.queue?.durationLength || 0);
            const titleLine = uri ? `**[${title}](${uri})**` : `**${title}**`;

            const body = [
              `### ${heading}`,
              titleLine,
              progressText(track, player),
              '',
              `🎙️ **Artist:** ${safeText(track?.author || 'Unknown', 100)}`,
              `⏱️ **Duration:** ${formatDuration(track?.length || 0)}`,
              `👤 **Requester:** ${safeText(requester, 100)}`,
            ];
            if (next) body.push('', `⏭️ **Up Next:** ${safeText(next.title, 90)} • ${formatDuration(next.length || 0)}`);

            const section = new SectionBuilder().addTextDisplayComponents(
              new TextDisplayBuilder().setContent(body.join('\n')),
            );
            const thumbnail = safeHttpUrl(track?.thumbnail);
            if (thumbnail) {
              section.setThumbnailAccessory(
                new ThumbnailBuilder().setURL(thumbnail).setDescription(`Artwork for ${safeText(track?.title || 'current song', 80)}`),
              );
            }

            const container = new ContainerBuilder().setAccentColor(JUKEBOX_ACCENT);
            if (notice) container.addTextDisplayComponents(new TextDisplayBuilder().setContent(`> ${safeText(notice, 600)}`));
            container.addSectionComponents(section);
            container.addSeparatorComponents(new SeparatorBuilder().setDivider(true));
            container.addTextDisplayComponents(new TextDisplayBuilder().setContent(
              `🔊 **Volume:** ${Math.round(player?.volume ?? 0)}%  •  🔁 **Loop:** ${prettyLoop(player?.loop)}  •  🔄 **Autoplay:** ${prettyAutoplay(autoplayMode)}  •  📜 **Up next:** ${queueCount}${queueDuration > 0 ? ` (${formatDuration(queueDuration)})` : ''}`,
            ));
            if (rows?.length) container.addSeparatorComponents(new SeparatorBuilder().setDivider(true));
            addRows(container, rows);
            return componentsV2Payload(container);
          }

          function idleContainerPayload(notice = null, heading = '⏹️ Playback Idle') {
            const lines = [
              `### ${heading}`,
              notice ? safeText(notice, 900) : 'Nothing is playing right now.',
              '',
              'Use `/play` to start music, or open your library below.',
            ];
            return textContainerPayload(lines, statusButtons());
          }

          """
          if marker not in ui:
              raise SystemExit('playerButtons marker not found')
          ui = ui.replace(marker, helpers + marker, 1)

          embed_end = """  if (thumbnail) embed.setThumbnail(thumbnail);
            return embed;
          }
          """
          player_payload = r"""

          export function jukeboxPlayerPayload(player, autoplayMode = 'off', notice = null, { canUndo = false } = {}) {
            const track = player?.queue?.current;
            if (!track) return idleContainerPayload(notice);
            return trackContainerPayload(track, player, autoplayMode, playerButtons(player, autoplayMode, { canUndo }), { notice });
          }
          """
          ui = replace_once(ui, embed_end, embed_end + player_payload, 'jukebox player payload insertion')

          legacy_panel_return = "return { content: lines.join('\\n'), embeds: [], components };"
          count = ui.count(legacy_panel_return)
          if count != 2:
              raise SystemExit(f'expected 2 queue/library legacy returns, got {count}')
          ui = ui.replace(legacy_panel_return, 'return textContainerPayload(lines, components);')

          playback_pattern = re.compile(
              r"export function playbackToolsPayload\(player, autoplayMode = 'off', notice = null\) \{.*?\n\}\n\nexport function seekModal\(\)",
              re.S,
          )
          playback_replacement = r"""export function playbackToolsPayload(player, autoplayMode = 'off', notice = null) {
            const track = player?.queue?.current;
            if (!track) return idleContainerPayload(notice, '⚙️ Playback Tools');
            const seekable = track?.isSeekable !== false && !track?.isStream;
            const rawPosition = Number(player?.position || 0);
            const position = Number.isFinite(rawPosition) ? Math.max(0, rawPosition) : 0;
            const length = Math.max(0, Number(track?.length || 0));

            const rows = [
              new ActionRowBuilder().addComponents(
                new ButtonBuilder().setCustomId('music:seekdelta:-30000').setLabel('-30s').setEmoji('⏪').setStyle(ButtonStyle.Secondary).setDisabled(!seekable || position <= 0),
                new ButtonBuilder().setCustomId('music:seekdelta:-10000').setLabel('-10s').setEmoji('↩️').setStyle(ButtonStyle.Secondary).setDisabled(!seekable || position <= 0),
                new ButtonBuilder().setCustomId('music:replay').setLabel('Replay').setEmoji('🔁').setStyle(ButtonStyle.Primary).setDisabled(!seekable),
                new ButtonBuilder().setCustomId('music:seekdelta:10000').setLabel('+10s').setEmoji('↪️').setStyle(ButtonStyle.Secondary).setDisabled(!seekable || (length > 0 && position >= length)),
                new ButtonBuilder().setCustomId('music:seekdelta:30000').setLabel('+30s').setEmoji('⏩').setStyle(ButtonStyle.Secondary).setDisabled(!seekable || (length > 0 && position >= length)),
              ),
              new ActionRowBuilder().addComponents(
                new ButtonBuilder().setCustomId('music:seekmodal').setLabel('Seek…').setEmoji('🎯').setStyle(ButtonStyle.Secondary).setDisabled(!seekable),
                new ButtonBuilder().setCustomId('music:history').setLabel('History').setEmoji('🕘').setStyle(ButtonStyle.Secondary),
                new ButtonBuilder().setCustomId('music:favorites').setLabel('Favorites').setEmoji('❤️').setStyle(ButtonStyle.Secondary),
                new ButtonBuilder().setCustomId('music:more_refresh').setLabel('Refresh').setEmoji('♻️').setStyle(ButtonStyle.Secondary),
                new ButtonBuilder().setCustomId('music:back').setLabel('Back').setEmoji('⬅️').setStyle(ButtonStyle.Secondary),
              ),
            ];

            return trackContainerPayload(track, player, autoplayMode, rows, {
              heading: '⚙️ Playback Tools',
              notice: notice || 'Progress is a snapshot; press Refresh to update it.',
            });
          }

          export function seekModal()"""
          ui, n = playback_pattern.subn(playback_replacement, ui, count=1)
          if n != 1:
              raise SystemExit(f'playbackToolsPayload replacement count {n}')

          path.write_text(ui, encoding='utf-8')

          # ---------- src/commands.js ----------
          path = Path('src/commands.js')
          commands = path.read_text(encoding='utf-8')
          commands = replace_once(commands, "  nowPlayingEmbed,\n", "  jukeboxPlayerPayload,\n", 'commands nowPlaying import')
          commands = replace_once(commands, "  playerButtons,\n", "", 'commands playerButtons import')

          old_private = """function privateReply(interaction, content, extra = {}) {
            const payload = { flags: PRIVATE_FLAGS, ...extra };
            if (content !== undefined && content !== null) payload.content = content;
            return interaction.reply(payload);
          }"""
          new_private = """function privateReply(interaction, content, extra = {}) {
            const extraFlags = Number(extra.flags || 0);
            const payload = { ...extra, flags: PRIVATE_FLAGS | extraFlags };
            if (extraFlags & MessageFlags.IsComponentsV2) {
              // Components V2 replaces legacy content/embeds. On create, omit
              // those fields entirely; edit payloads keep null/[] so a legacy
              // interaction message can be upgraded to V2 safely.
              delete payload.content;
              delete payload.embeds;
            } else if (content !== undefined && content !== null) {
              payload.content = content;
            }
            return interaction.reply(payload);
          }"""
          commands = replace_once(commands, old_private, new_private, 'privateReply')

          old_player_payload = """function playerPanelPayload(player, autoplayMode, notice = null, { canUndo = false } = {}) {
            const track = player?.queue?.current;
            if (!track) return { content: notice || 'Nothing is playing.', embeds: [], components: [] };
            return {
              content: notice,
              embeds: [nowPlayingEmbed(track, player, autoplayMode)],
              components: playerButtons(player, autoplayMode, { canUndo }),
            };
          }"""
          new_player_payload = """function playerPanelPayload(player, autoplayMode, notice = null, { canUndo = false } = {}) {
            return jukeboxPlayerPayload(player, autoplayMode, notice, { canUndo });
          }"""
          commands = replace_once(commands, old_player_payload, new_player_payload, 'playerPanelPayload')

          old_library_back = """    const recovery = getRecoverableSession(interaction.guildId);
            return interaction.editReply({ content: 'Library closed. Use `/status` for full bot health.', embeds: [], components: statusButtons({ hasRecovery: Boolean(recovery) }) });"""
          if old_library_back not in commands:
              old_library_back = """  const recovery = getRecoverableSession(interaction.guildId);
            return interaction.editReply({ content: 'Library closed. Use `/status` for full bot health.', embeds: [], components: statusButtons({ hasRecovery: Boolean(recovery) }) });"""
          if old_library_back in commands:
              commands = commands.replace(
                  old_library_back,
                  """    return interaction.editReply(playbackToolsPayload(null, getGuildAutoplay(interaction.guildId), 'Library closed. Use `/status` for full bot health.'));""",
                  1,
              )
          else:
              commands, n = re.subn(
                  r"\s*const recovery = getRecoverableSession\(interaction\.guildId\);\n\s*return interaction\.editReply\(\{ content: 'Library closed\. Use `/status` for full bot health\.', embeds: \[\], components: statusButtons\(\{ hasRecovery: Boolean\(recovery\) \}\) \}\);",
                  "\n    return interaction.editReply(playbackToolsPayload(null, getGuildAutoplay(interaction.guildId), 'Library closed. Use `/status` for full bot health.'));",
                  commands,
                  count=1,
              )
              if n != 1:
                  raise SystemExit(f'libraryback V2 replacement count {n}')

          old_stop = """      return interaction.editReply({ content: `Stopped and reset. Cleared ${removed} upcoming/preserved track${removed === 1 ? '' : 's'}.`, embeds: [], components: statusButtons() });"""
          new_stop = """      return interaction.editReply(panelPayload(player, interaction.guildId, `⏹️ Stopped and reset. Cleared ${removed} upcoming/preserved track${removed === 1 ? '' : 's'}.`));"""
          commands = replace_once(commands, old_stop, new_stop, 'component stop V2')

          path.write_text(commands, encoding='utf-8')

          # ---------- test/ui.test.js ----------
          path = Path('test/ui.test.js')
          tests = path.read_text(encoding='utf-8')
          tests = replace_once(
              tests,
              "import assert from 'node:assert/strict';\n",
              "import assert from 'node:assert/strict';\nimport { MessageFlags } from 'discord.js';\n",
              'ui test MessageFlags import',
          )
          tests = replace_once(
              tests,
              "import { favoritesPayload, historyPayload, playbackToolsPayload, playerButtons, queueManagerPayload, queueText, searchPickerPayload, statusButtons, undoButtonComponents } from '../src/ui.js';",
              "import { favoritesPayload, historyPayload, jukeboxPlayerPayload, playbackToolsPayload, playerButtons, queueManagerPayload, queueText, searchPickerPayload, statusButtons, undoButtonComponents } from '../src/ui.js';",
              'ui test import',
          )

          helper_marker = "test('player panel exposes only approved lightweight controls', () => {"
          helper_code = r"""
          function nestedButtonLabels(components) {
            const labels = [];
            const visit = (component) => {
              if (!component) return;
              if (component.data?.label) labels.push(component.data.label);
              for (const child of component.components || []) visit(child);
            };
            for (const component of components || []) visit(component);
            return labels;
          }

          test('jukebox player uses one Components V2 container with controls inside it', () => {
            const payload = jukeboxPlayerPayload(fakePlayer(), 'standard');
            assert.equal(payload.flags, MessageFlags.IsComponentsV2);
            assert.equal(payload.content, null);
            assert.deepEqual(payload.embeds, []);
            assert.equal(payload.components.length, 1);
            const json = JSON.stringify(payload.components[0].toJSON());
            assert.match(json, /Now Playing/);
            assert.match(json, /music:pause/);
            assert.match(json, /music:queue/);
          });

          """
          if helper_marker not in tests:
              raise SystemExit('ui test marker missing')
          tests = tests.replace(helper_marker, helper_code + helper_marker, 1)

          tests = replace_once(
              tests,
              "  const labels = payload.components.flatMap((row) => row.components).map((component) => component.data.label);",
              "  const labels = nestedButtonLabels(payload.components);",
              'playback tools nested labels',
          )
          path.write_text(tests, encoding='utf-8')

          # ---------- README.md ----------
          path = Path('README.md')
          readme = path.read_text(encoding='utf-8')
          old = "The response is visible only to you. It shows artwork, title, artist, duration, requester, Up Next, saved volume, loop, autoplay, and upcoming count."
          new = "The response is visible only to you. The player now uses Discord Components V2: artwork, metadata, status and every control button live inside one colored JukeBox container instead of buttons floating below a legacy embed."
          if old in readme:
              readme = readme.replace(old, new, 1)
          path.write_text(readme, encoding='utf-8')

      - name: Install dependencies
        run: npm install

      - name: Syntax check
        run: npm run check

      - name: Test
        run: npm test

      - name: Commit converted UI
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/ui.js src/commands.js test/ui.test.js README.md
          if git diff --cached --quiet; then
            echo "No patch changes to commit."
            exit 0
          fi
          git commit -m "feat: put player controls inside Components V2 jukebox"
          git push origin HEAD:feature/jukebox-components-v2
