name: Temporary v0.1.15 SQLite compatibility fix

on:
  push:
    branches: [audit/v0.1.15-deep-reliability]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: audit/v0.1.15-deep-reliability
      - uses: actions/setup-node@v6
        with:
          node-version: '22.14.0'
          package-manager-cache: false
      - name: Restore Windows-compatible SQLite binding
        run: npm install --save-exact better-sqlite3@12.11.1
      - run: npm ci
      - run: node -e "import('./src/storage.js').then(({ closeStorage }) => closeStorage())"
      - run: npm run check
      - run: npm test
      - name: Commit compatibility fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          git commit -m 'fix: retain prebuilt SQLite compatibility on Windows'
          git push origin HEAD:audit/v0.1.15-deep-reliability
