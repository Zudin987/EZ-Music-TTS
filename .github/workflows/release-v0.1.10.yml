name: Publish EZ Music v0.1.10

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/release-v0.1.10.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: 35a3f70d63ba04db9e6c749cd4e33e68f60ea396

      - name: Verify tested release source
        run: |
          set -euo pipefail
          test "$(node -p "require('./package.json').version")" = "0.1.10"
          test -f package-lock.json
          test -f src/playback-fallback.js
          test -f src/search-quality.js
          test -f test/search-playback-v0110.test.js
          grep -q 'isCredentiallessYoutubeBlock' src/playback-fallback.js
          grep -q 'chooseSoundCloudAlternative' src/playback-fallback.js
          grep -q 'playbackFallbackQuery' src/playback-fallback.js
          grep -q 'trySoundCloudPlaybackFallback' src/music.js
          grep -q 'soundcloud: true' lavalink/application.yml
          grep -q 'bufferDurationMs: 2000' lavalink/application.yml
          grep -q 'frameBufferDurationMs: 20000' lavalink/application.yml
          grep -q 'nonAllocatingFrameBuffer: true' lavalink/application.yml
          grep -q -- '-Xmx256M' start-bot.bat
          grep -q -- '--max-old-space-size=128' start-bot.bat

      - name: Build clean Windows install ZIP
        run: |
          set -euo pipefail
          VERSION="v0.1.10"
          ROOT="dist/EZ-Music"
          mkdir -p "$ROOT/src" "$ROOT/lavalink"
          cp README.md package.json package-lock.json .env.example setup.bat start-bot.bat start-hidden.vbs stop-bot.bat install-autostart.bat install-autostart.ps1 remove-autostart.bat "$ROOT/"
          cp src/*.js "$ROOT/src/"
          cp lavalink/application.yml "$ROOT/lavalink/"
          cat > "$ROOT/CLEAN-INSTALL.txt" <<'EOF'
          EZ MUSIC v0.1.10 CLEAN WINDOWS INSTALL
          =====================================
          1. Stop EZ Music.
          2. Back up C:\EZ-Music\.env.
          3. To preserve volume, favorites, history and crash/restart recovery,
             also back up C:\EZ-Music\data\ez-music.sqlite.
          4. Remove or rename the old C:\EZ-Music folder for a truly clean install.
          5. Extract this ZIP so the app lives at C:\EZ-Music.
          6. Restore your backed-up .env to C:\EZ-Music\.env.
          7. Restore data\ez-music.sqlite if you intentionally backed it up.
          8. Run setup.bat. Dependencies are installed from package-lock.json with npm ci.
          9. Test with start-bot.bat.
          10. When satisfied, use start-hidden.vbs; reinstall Task Scheduler only if needed.

          v0.1.10 SEARCH / PLAYBACK RECOVERY
          ----------------------------------
          - Exact title-only YTM results are treated as ambiguous when the uploader/artist
            does not match any search intent. Normal YouTube is compared before selection.
          - This prevents unrelated same-title uploads from silently winning.
          - Current credential-free youtube-source playback can be blocked by YouTube with
            login/SABR-style failures even when the correct video was selected.
          - When that known all-client failure occurs, EZ Music uses the already-enabled
            SoundCloud source as a best-effort audio fallback for the same cleaned title.
          - Fallback candidates still pass the normal relevance/variant filters; remix,
            cover, karaoke, instrumental, piano and similar versions are not accepted unless
            they match the requested intent.
          - For other playback exceptions, one alternate YouTube result may be tried before
            SoundCloud and the existing source-protection logic.
          - SoundCloud fallback is best effort: not every song has a suitable SoundCloud copy.

          PLAYBACK / MEMORY POLICY
          ------------------------
          - No Spotify/YouTube account, OAuth, remote poToken/SABR service or yt-dlp added.
          - No extra process, dashboard, worker, transcoder or cache service added.
          - Audio behavior stays raw: no EQ, filters, crossfade or DSP except volume.
          - 2s NAS / 20s frame buffer and nonAllocatingFrameBuffer remain unchanged.
          - Lavalink stays capped at 256 MB Java heap; Node old-space stays capped at 128 MB.
          - YouTube client order stays MUSIC, ANDROID_VR, WEB, WEBEMBEDDED.

          This package intentionally contains no .env, real secrets, SQLite database,
          node_modules, logs, Lavalink.jar, or runtime plugin files.
          EOF
          cd dist
          zip -r -9 "EZ-Music-${VERSION}-Windows-Clean.zip" EZ-Music >/dev/null
          sha256sum "EZ-Music-${VERSION}-Windows-Clean.zip" > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Preserve exact package as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: EZ-Music-v0.1.10-Windows-Clean
          path: |
            dist/EZ-Music-v0.1.10-Windows-Clean.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create v0.1.10 \
            dist/EZ-Music-v0.1.10-Windows-Clean.zip \
            dist/SHA256SUMS.txt \
            --target 35a3f70d63ba04db9e6c749cd4e33e68f60ea396 \
            --title "EZ Music v0.1.10" \
            --notes "Fixes the reported no-audio failure and the remaining same-title search ambiguity. Exact title-only YTM matches with no artist/uploader signal are now compared against normal YouTube, preventing unrelated same-title uploads from silently winning. The uploaded launcher log also exposed a current upstream youtube-source credential-free playback block: even the correct NMIXX/JYP video can fail with all-clients/login/no-audio-stream/player-configuration errors. EZ Music now recognizes that failure and uses the already-enabled SoundCloud source as a relevance-checked best-effort audio fallback for the same cleaned title; remix/cover/karaoke/instrumental/etc. filtering is retained. Other playback exceptions can try one alternate YouTube result before SoundCloud. No OAuth, account, remote poToken/SABR service, yt-dlp, extra process, DSP, heap increase or buffer increase is added. A real production-profile Lavalink 4.2.2 test at the 256 MB heap resolved Heavy Serenade to the correct NMIXX/JYP result, reproduced the YouTube block, selected a standard SoundCloud fallback and direct-loaded that SoundCloud URI successfully. PR #12 and post-merge main passed Windows, Ubuntu and Lavalink CI. SoundCloud fallback is best effort because not every song has a suitable SoundCloud copy."

      - name: Remove merged feature branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin --delete fix/v0110-search-playback-fallback || true
