name: Publish EZ Music v0.1.2

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: 46cd7ef72018ebcc915f5ec0029ef77d0ea69eaa

      - name: Verify release source
        shell: bash
        run: |
          set -euo pipefail
          test "$(node -p "require('./package.json').version")" = "0.1.2"
          test -f src/live-panel.js

      - name: Build clean Windows install ZIP
        shell: bash
        run: |
          set -euo pipefail
          VERSION="v0.1.2"
          ROOT="dist/EZ-Music"
          mkdir -p "$ROOT/src" "$ROOT/lavalink"

          cp README.md package.json .env.example setup.bat start-bot.bat start-hidden.vbs stop-bot.bat install-autostart.bat install-autostart.ps1 remove-autostart.bat "$ROOT/"
          cp src/*.js "$ROOT/src/"
          cp lavalink/application.yml "$ROOT/lavalink/"

          cat > "$ROOT/CLEAN-INSTALL.txt" <<'EOF'
          EZ MUSIC v0.1.2 CLEAN WINDOWS INSTALL
          ====================================
          1. Stop EZ Music.
          2. Back up C:\EZ-Music\.env.
          3. If you want to preserve volume, favorites, history and recovery data,
             also back up C:\EZ-Music\data\ez-music.sqlite.
          4. Remove/rename the old C:\EZ-Music folder for a truly clean install.
          5. Extract this ZIP so the app lives at C:\EZ-Music.
          6. Restore your backed-up .env to C:\EZ-Music\.env.
          7. Restore data\ez-music.sqlite if you backed it up.
          8. Run setup.bat.
          9. Test with start-bot.bat.
          10. When satisfied, use start-hidden.vbs; reinstall Task Scheduler only if needed.

          v0.1.2 keeps the Components V2 private JukeBox from v0.1.1 and adds
          lightweight live refresh roughly every 10 seconds. The main player lease
          retires after about 14 minutes before Discord's ephemeral interaction token
          expires; Refresh or Back starts a fresh live window.

          Queue/More/History/Favorites pause live refresh so sub-views are not
          overwritten. No audio effects, DSP, extra daemon, Docker or WSL were added.

          This package intentionally contains no .env, SQLite database, node_modules,
          or Lavalink.jar. setup.bat installs/downloads required runtime files.
          EOF

          cd dist
          zip -r -9 "EZ-Music-${VERSION}-Windows-Clean.zip" EZ-Music >/dev/null
          sha256sum "EZ-Music-${VERSION}-Windows-Clean.zip" > SHA256SUMS.txt

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v0.1.2 >/dev/null 2>&1; then
            echo "Release v0.1.2 already exists; leaving it unchanged."
          else
            gh release create v0.1.2 \
              dist/EZ-Music-v0.1.2-Windows-Clean.zip \
              dist/SHA256SUMS.txt \
              --target 46cd7ef72018ebcc915f5ec0029ef77d0ea69eaa \
              --title "EZ Music v0.1.2" \
              --notes "Live JukeBox refresh update. The private /nowplaying Components V2 player now refreshes current-track progress/status about every 10 seconds using one bounded lazy timer. Queue, More, History and Favorites pause the live lease so sub-views are never overwritten; Back/Refresh starts a fresh lease. Each live lease retires after about 14 minutes before the ephemeral interaction token expires. Playback end/disconnect performs a final idle update and stops tracking. No new runtime dependency, service, audio filter or DSP was added; raw-audio and low-RAM behavior remain unchanged. CI passed on Ubuntu and Windows plus the standalone Lavalink/YouTube smoke test."
          fi

      - name: Remove merged/temp feature branches
        shell: bash
        run: |
          set -euo pipefail
          git remote set-url origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git push origin --delete feature/live-jukebox-refresh || true
          git push origin --delete feature/live-jukebox-v2 || true
