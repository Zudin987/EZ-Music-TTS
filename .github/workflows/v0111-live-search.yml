name: Live-check v0.1.11 search choices

on:
  push:
    branches:
      - feat/v0111-three-choice-search
    paths:
      - .github/workflows/v0111-live-search.yml

permissions:
  contents: read

jobs:
  live-search:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/v0111-three-choice-search
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v6
        with:
          node-version: 22.14.0
          package-manager-cache: false
      - name: Verify full regression suite
        run: |
          npm ci
          npm run check
          npm test
      - name: Start production-profile Lavalink
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 2 https://github.com/lavalink-devs/Lavalink/releases/download/4.2.2/Lavalink.jar -o lavalink/Lavalink.jar
          echo '8cb801e591072c3689fafd71ccf571a95a4ead3cc35dfc045e157d763d89119a  lavalink/Lavalink.jar' | sha256sum -c -
          cd lavalink
          java -Xms64M -Xmx256M -jar Lavalink.jar > ../lavalink-v0111.log 2>&1 &
          echo $! > ../lavalink-v0111.pid
          cd ..
          ready=0
          for attempt in {1..90}; do
            if curl -fsS -H 'Authorization: ezmusic-local-only' http://127.0.0.1:2333/version >/dev/null; then ready=1; break; fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then tail -n 160 lavalink-v0111.log >&2 || true; exit 1; fi
      - name: Resolve exact reported query into user choices
        run: |
          node --input-type=module <<'NODE'
          import { resolveSearchChoices } from './src/search-choices.js';

          const calls = [];
          const target = {
            async search(query, options = {}) {
              const identifier = options.source ? `${options.source}${query}` : query;
              calls.push(identifier);
              const url = new URL('http://127.0.0.1:2333/v4/loadtracks');
              url.searchParams.set('identifier', identifier);
              const response = await fetch(url, { headers: { Authorization: 'ezmusic-local-only' } });
              if (!response.ok) throw new Error(`Lavalink ${response.status}`);
              const body = await response.json();
              const raw = body.loadType === 'search' ? body.data : body.loadType === 'track' ? [body.data] : [];
              return {
                type: body.loadType === 'search' ? 'SEARCH' : body.loadType?.toUpperCase?.() || 'EMPTY',
                tracks: raw.map((item) => ({ ...(item.info || {}), encoded: item.encoded })),
              };
            },
          };

          const choices = await resolveSearchChoices(target, 'Heavy Serenade', null, { limit: 3 });
          console.log('calls:', calls.join(' | '));
          for (const [index, choice] of choices.entries()) {
            console.log(`${index + 1}. [${choice.kind}] ${choice.track.title} — ${choice.track.author} — ${choice.track.uri}`);
          }

          if (calls.length !== 3 || calls[0] !== 'ytsearch:Heavy Serenade lyrics' || calls[1] !== 'ytmsearch:Heavy Serenade' || calls[2] !== 'ytsearch:Heavy Serenade') {
            throw new Error(`Unexpected search plan: ${calls.join(' -> ')}`);
          }
          if (choices.length < 2 || choices.length > 3) throw new Error(`Expected 2-3 useful choices, got ${choices.length}`);
          if (!choices.every((choice) => /heavy/i.test(choice.track.title || '') && /serenade/i.test(choice.track.title || ''))) {
            throw new Error('A returned choice does not match Heavy Serenade');
          }
          const badVariant = /karaoke|instrumental|piano|remix|cover|performance|stage|fancam|musiccore|inkigayo|countdown|music\s*bank|hidden\s+vocals|vocals\s+louder|bass\s+boosted|\b8d\b|line\s+distribution|fan\s*made|fanmade|\bedit\b/i;
          if (choices.some((choice) => badVariant.test(`${choice.track.title || ''} ${choice.track.author || ''}`))) {
            throw new Error('An unrequested alternate/stage/edit version escaped filtering');
          }
          if (!choices.every((choice) => /nmixx|jyp/i.test(`${choice.track.title || ''} ${choice.track.author || ''}`))) {
            throw new Error('An unrelated same-title artist remains in the picker');
          }
          const mvIndex = choices.findIndex((choice) => choice.kind === 'M/V');
          const preferredIndex = choices.findIndex((choice) => choice.kind === 'Lyrics' || choice.kind === 'Audio');
          if (mvIndex === 0 && preferredIndex > 0) throw new Error('M/V ranked ahead of an available Lyrics/Audio choice');
          NODE
      - name: Stop Lavalink
        if: always()
        run: |
          if [ -f lavalink-v0111.pid ]; then kill "$(cat lavalink-v0111.pid)" 2>/dev/null || true; fi
      - name: Show log on failure
        if: failure()
        run: tail -n 160 lavalink-v0111.log || true
