name: Apply v0.1.7 Audit Hardening

on:
  push:
    branches:
      - audit/v017-hardening
    paths:
      - .github/workflows/audit-v017-patch.yml

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: audit/v017-hardening
      - uses: actions/setup-node@v6
        with:
          node-version: '22.14.0'
          package-manager-cache: false
      - name: Fix deliberate duplicate replacement guard
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tools/audit_v017_patch.py')
          text = path.read_text(encoding='utf-8')
          old = "    if count != 1:\n        raise RuntimeError(f'{label}: expected exactly one match, found {count}')"
          new = "    if count < 1:\n        raise RuntimeError(f'{label}: expected at least one match, found {count}')"
          if old not in text:
              raise SystemExit('replace_once guard not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Apply audited patch
        run: python3 tools/audit_v017_patch.py
      - name: Align old regression tests and simplify stale-picker guard
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def update(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'expected text not found in {path}: {old!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          update(
              'src/commands.js',
              "if (!searchPickers.isCurrent(entry, isQueueRevisionCurrent(interaction.guildId, entry.revision) ? entry.revision : Number.NaN)) {",
              "if (!isQueueRevisionCurrent(interaction.guildId, entry.revision)) {",
          )

          update(
              'test/autostart.test.js',
              "  assert.match(index, /finally\\(\\(\\) => process\\.exit\\(exitCode\\)\\)/);",
              "  assert.match(index, /createShutdownCoordinator/);\n  assert.match(index, /shutdownCoordinator\\.isRunning\\(\\)/);\n  assert.match(index, /finally\\(\\(\\) => process\\.exit\\(requestedExitCode\\)\\)/);",
          )

          p = Path('test/library-recovery.test.js')
          text = p.read_text(encoding='utf-8')
          anchor = "const ui = fs.readFileSync('src/ui.js', 'utf8');"
          if anchor not in text:
              raise SystemExit('library-recovery import anchor not found')
          text = text.replace(anchor, anchor + "\nconst searchPicker = fs.readFileSync('src/search-picker.js', 'utf8');", 1)
          old = """  assert.match(commands, /SEARCH_PICKER_TTL_MS = 120_000/);
  assert.match(commands, /searchPickers = new Map\\(\\)/);
  assert.match(commands, /tracks\\.slice\\(0, 5\\)/);"""
          new = """  assert.match(searchPicker, /SEARCH_PICKER_TTL_MS = 120_000/);
  assert.match(searchPicker, /SEARCH_PICKER_MAX = 32/);
  assert.match(searchPicker, /tracks: Array\\.isArray\\(tracks\\) \\? tracks\\.slice\\(0, 5\\)/);
  assert.match(searchPicker, /revision:/);
  assert.match(commands, /isQueueRevisionCurrent\\(interaction\\.guildId, entry\\.revision\\)/);"""
          if old not in text:
              raise SystemExit('library-recovery picker expectations not found')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')

          update(
              'test/source-routing.test.js',
              "  assert.equal(pkg.version, '0.1.6');",
              "  assert.equal(pkg.version, '0.1.7');",
          )
          PY
      - name: Generate lockfile
        run: npm install --package-lock-only --ignore-scripts
      - name: Install exact dependency tree
        run: npm ci
      - name: Syntax check
        run: npm run check
      - name: Test
        run: npm test
      - name: Verify low-memory invariants
        shell: bash
        run: |
          set -euo pipefail
          grep -q -- '-Xmx256M' start-bot.bat
          grep -q -- '--max-old-space-size=128' start-bot.bat
          grep -q 'bufferDurationMs: 2000' lavalink/application.yml
          grep -q 'frameBufferDurationMs: 20000' lavalink/application.yml
          grep -q 'nonAllocatingFrameBuffer: true' lavalink/application.yml
      - name: Commit product changes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: harden v0.1.7 audit findings'
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin HEAD:audit/v017-hardening
