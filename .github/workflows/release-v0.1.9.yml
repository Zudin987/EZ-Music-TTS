name: Publish EZ Music v0.1.9

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/release-v0.1.9.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ba722469d2600504e51896ae456d688cc39e4e54

      - name: Verify tested release source
        run: |
          set -euo pipefail
          test "$(node -p "require('./package.json').version")" = "0.1.9"
          test -f package-lock.json
          test -f src/source-routing.js
          test -f src/search-quality.js
          test -f src/playback-start.js
          test -f test/search-playback-v019.test.js
          grep -q 'SEARCH_MATCH_THRESHOLD = 0.55' src/search-quality.js
          grep -q 'ensureQueuedPlayback' src/commands.js
          grep -q 'Playback Idle — Queue Waiting' src/ui.js
          grep -q 'bufferDurationMs: 2000' lavalink/application.yml
          grep -q 'frameBufferDurationMs: 20000' lavalink/application.yml
          grep -q 'nonAllocatingFrameBuffer: true' lavalink/application.yml
          grep -q -- '-Xmx256M' start-bot.bat
          grep -q -- '--max-old-space-size=128' start-bot.bat

      - name: Build clean Windows install ZIP
        run: |
          set -euo pipefail
          VERSION="v0.1.9"
          ROOT="dist/EZ-Music"
          mkdir -p "$ROOT/src" "$ROOT/lavalink"
          cp README.md package.json package-lock.json .env.example setup.bat start-bot.bat start-hidden.vbs stop-bot.bat install-autostart.bat install-autostart.ps1 remove-autostart.bat "$ROOT/"
          cp src/*.js "$ROOT/src/"
          cp lavalink/application.yml "$ROOT/lavalink/"
          cat > "$ROOT/CLEAN-INSTALL.txt" <<'EOF'
          EZ MUSIC v0.1.9 CLEAN WINDOWS INSTALL
          ====================================
          1. Stop EZ Music.
          2. Back up C:\EZ-Music\.env.
          3. To preserve volume, favorites, history and crash/restart recovery,
             also back up C:\EZ-Music\data\ez-music.sqlite.
          4. Remove or rename the old C:\EZ-Music folder for a truly clean install.
          5. Extract this ZIP so the app lives at C:\EZ-Music.
          6. Restore your backed-up .env to C:\EZ-Music\.env.
          7. Restore data\ez-music.sqlite if you intentionally backed it up.
          8. Run setup.bat. Dependencies are installed from package-lock.json with npm ci.
          9. Test with start-bot.bat.
          10. When satisfied, use start-hidden.vbs; reinstall Task Scheduler only if needed.

          v0.1.9 SEARCH / PLAYBACK RELIABILITY
          ------------------------------------
          - Plain-text searches still prefer YouTube Music, but a result must actually
            resemble the requested title/artist before it can win.
          - Weak YTM matches fall through to normal YouTube instead of silently adding
            an unrelated song such as another track by the same artist.
          - Unrequested alternate versions such as cover, karaoke, instrumental, piano,
            remix, live, acoustic, sped-up and slowed are penalized. They remain valid
            when the query explicitly asks for that version.
          - Idle queue start now checks Lavalink/Shoukaku's real track state instead of
            trusting only Kazagumo's wrapper playing flag.
          - A deliberate manual pause is never implicitly resumed by queue/start recovery.
          - Track resolve failures are reported instead of falsely saying a track started.
          - /nowplaying can safely recover an idle waiting queue and otherwise shows the
            queued track/count rather than only saying that nothing is playing.
          - /status distinguishes real playback from an idle queue waiting state.

          PLAYBACK / MEMORY POLICY
          ------------------------
          - Audio behavior remains raw: no EQ, filters, crossfade or DSP except volume.
          - 2s NAS / 20s frame buffer and nonAllocatingFrameBuffer remain unchanged.
          - Lavalink stays capped at 256 MB Java heap; Node old-space stays capped at 128 MB.
          - YouTube client order and existing source/plugin architecture remain unchanged.
          - No extra process, dashboard, cache service, transcoder or polling worker was added.

          This package intentionally contains no .env, real secrets, SQLite database,
          node_modules, logs, Lavalink.jar, or runtime plugin files.
          EOF
          cd dist
          zip -r -9 "EZ-Music-${VERSION}-Windows-Clean.zip" EZ-Music >/dev/null
          sha256sum "EZ-Music-${VERSION}-Windows-Clean.zip" > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create v0.1.9 \
            dist/EZ-Music-v0.1.9-Windows-Clean.zip \
            dist/SHA256SUMS.txt \
            --target ba722469d2600504e51896ae456d688cc39e4e54 \
            --title "EZ Music v0.1.9" \
            --notes "Fixes the reported search/queue/Now Playing failures. Plain-text YouTube Music results now need to match the requested title/artist; weak matches fall through to normal YouTube, and unrequested cover/karaoke/instrumental/piano/remix/live/acoustic/sped-up/slowed variants are rejected unless explicitly requested. Idle playback start now uses Lavalink/Shoukaku's actual track state instead of a stale Kazagumo playing flag, resolve failures cannot be reported as successful starts, and deliberate manual pauses remain protected. /nowplaying can recover a waiting queue when safe and otherwise shows a queue-aware idle panel; /status distinguishes real playback from an idle queue. The same centralized start protection is used by other queue entry points. PR #11 passed Windows, Ubuntu and standalone Lavalink/YouTube/LavaSrc CI, and the exact reported Heavy Serenade searches were also exercised against a real Lavalink source during pre-PR verification. Existing raw-audio behavior, 2s/20s buffers, non-allocating frame buffer, 256 MB Java heap, 128 MB Node old-space cap and lean single-node architecture remain unchanged."

      - name: Remove merged feature branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin --delete fix/v019-search-start-nowplaying || true
