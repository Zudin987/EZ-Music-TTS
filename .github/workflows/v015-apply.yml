name: Apply v0.1.5 implementation

on:
  push:
    branches:
      - feat/v015-stability-public-nowplaying
    paths:
      - .github/workflows/v015-apply.yml
      - .github/scripts/v015_patch.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v015-stability-public-nowplaying
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0

      - name: Apply patch
        run: python3 .github/scripts/v015_patch.py

      - name: Install dependencies
        run: npm install --package-lock=false

      - name: Syntax check
        run: npm run check

      - name: Tests
        run: npm test

      - name: Commit implementation
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add package.json lavalink/application.yml src/music.js src/commands.js src/live-panel.js README.md test/private-interactions.test.js test/live-panel.test.js test/playback-stability.test.js
          git commit -m "feat: improve playback stability and public nowplaying"
          git push origin HEAD:feat/v015-stability-public-nowplaying
