name: Verify v0.1.8 Spotify fallback

on:
  push:
    branches:
      - feat/v018-spotify-oembed-performance
    paths:
      - .github/workflows/v018-patch.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/v018-spotify-oembed-performance
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: '22.14.0'
          cache: npm

      - name: Apply final audited status fix
        run: |
          set -euo pipefail
          node tools/v018-patch.mjs
          test "$(node -p "require('./package.json').version")" = "0.1.8"

      - name: Install locked dependencies
        run: npm ci

      - name: Syntax and regression tests
        run: |
          npm run check
          npm test

      - name: Live Spotify oEmbed smoke
        run: >-
          node --input-type=module -e "import { fetchSpotifyOEmbed } from './src/source-routing.js'; const m = await fetchSpotifyOEmbed('https://open.spotify.com/track/4uLU6hMCjMI75M1A2tKUQC'); if (m.type !== 'track' || !m.title || !m.canonicalUrl) throw new Error('Unexpected oEmbed result'); console.log('[spotify-oembed]', m.type, m.title);"

      - name: Verify low-memory playback invariants
        run: |
          set -euo pipefail
          grep -q 'bufferDurationMs: 2000' lavalink/application.yml
          grep -q 'frameBufferDurationMs: 20000' lavalink/application.yml
          grep -q 'nonAllocatingFrameBuffer: true' lavalink/application.yml
          grep -q 'gc-warnings: true' lavalink/application.yml
          grep -q -- '-Xmx256M' start-bot.bat
          grep -q -- '--max-old-space-size=128' start-bot.bat
          git diff --check

      - name: Commit verified status fix
        run: |
          set -euo pipefail
          git config user.name "MrEz"
          git config user.email "39240221+Zudin987@users.noreply.github.com"
          git add src/commands.js
          if git diff --cached --quiet; then
            echo 'No status change to commit.'
          else
            git commit -m 'fix: report credential-free Spotify track fallback in status'
            git push origin HEAD:feat/v018-spotify-oembed-performance
          fi

      # Temporary verification workflow; removed before PR.
