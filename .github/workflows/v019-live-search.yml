name: Live-check v0.1.9 search routing

on:
  push:
    branches:
      - fix/v019-search-start-nowplaying
    paths:
      - .github/workflows/v019-live-search.yml

permissions:
  contents: read

jobs:
  live-search:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/v019-search-start-nowplaying
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v6
        with:
          node-version: 22.14.0
      - name: Start production-profile Lavalink
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 2 \
            https://github.com/lavalink-devs/Lavalink/releases/download/4.2.2/Lavalink.jar \
            -o lavalink/Lavalink.jar
          echo '8cb801e591072c3689fafd71ccf571a95a4ead3cc35dfc045e157d763d89119a  lavalink/Lavalink.jar' | sha256sum -c -
          cd lavalink
          java -Xms64M -Xmx256M -jar Lavalink.jar > ../lavalink-v019.log 2>&1 &
          echo $! > ../lavalink-v019.pid
          cd ..
          ready=0
          for attempt in {1..90}; do
            if curl -fsS -H 'Authorization: ezmusic-local-only' http://127.0.0.1:2333/version >/dev/null; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            tail -n 200 lavalink-v019.log >&2 || true
            exit 1
          fi
      - name: Require correct routing for the exact reported searches
        run: |
          node --input-type=module <<'NODE'
          import { resolvePreferredSearch } from './src/source-routing.js';

          const calls = [];
          const target = {
            async search(query, options = {}) {
              const identifier = options.source ? `${options.source}${query}` : query;
              calls.push(identifier);
              const url = new URL('http://127.0.0.1:2333/v4/loadtracks');
              url.searchParams.set('identifier', identifier);
              const response = await fetch(url, { headers: { Authorization: 'ezmusic-local-only' } });
              if (!response.ok) throw new Error(`Lavalink ${response.status}`);
              const body = await response.json();
              const raw = body.loadType === 'search' ? body.data : body.loadType === 'track' ? [body.data] : [];
              return {
                type: body.loadType === 'search' ? 'SEARCH' : body.loadType?.toUpperCase?.() || 'EMPTY',
                tracks: raw.map((item) => ({
                  ...(item.info || {}),
                  encoded: item.encoded,
                  title: item.info?.title || '',
                  author: item.info?.author || '',
                })),
              };
            },
          };

          const bannedTitle = /\b(cover|karaoke|instrumental|remix|acoustic|nightcore|slowed|live)\b|\bsped\s+up\b/i;
          const bannedAuthor = /\b(cover|karaoke|instrumental|piano|tribute)\b/i;
          for (const query of ['heavy serenade', 'heavy serenade nmixx']) {
            calls.length = 0;
            const result = await resolvePreferredSearch(target, query, null);
            const first = result?.tracks?.[0];
            if (!first) throw new Error(`No relevant result survived routing for: ${query}`);
            const title = String(first.title || '');
            const author = String(first.author || '');
            const combined = `${title} ${author}`;
            if (!/heavy/i.test(title) || !/serenade/i.test(title)) {
              throw new Error(`Wrong title for ${query}: ${first.title} — ${first.author}`);
            }
            if (bannedTitle.test(title) || bannedAuthor.test(author)) {
              throw new Error(`Unrequested alternate version survived for ${query}: ${first.title} — ${first.author}`);
            }
            if (/nmixx/i.test(query) && !/nmixx/i.test(combined)) {
              throw new Error(`Artist mismatch for ${query}: ${first.title} — ${first.author}`);
            }
            if (calls[0] !== `ytmsearch:${query}` || calls.length > 2 || (calls.length === 2 && calls[1] !== `ytsearch:${query}`)) {
              throw new Error(`Unexpected routing for ${query}: ${calls.join(' -> ')}`);
            }
            console.log(`${query} => ${first.title} — ${first.author}`);
            console.log(`routes: ${calls.join(' -> ')}`);
          }
          NODE
      - name: Stop Lavalink
        if: always()
        run: |
          if [ -f lavalink-v019.pid ]; then
            kill "$(cat lavalink-v019.pid)" 2>/dev/null || true
          fi
      - name: Show Lavalink log on failure
        if: failure()
        run: tail -n 200 lavalink-v019.log || true

# Final live rerun after source/uploader variant filtering.
