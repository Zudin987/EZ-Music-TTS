name: Publish EZ Music v0.1.11

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/release-v0.1.11.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          ref: 08f4cb102e72f3d77997b0a1b09840ded25e6774

      - uses: actions/setup-node@v6
        with:
          node-version: 22.14.0
          package-manager-cache: false

      - name: Verify release source
        shell: bash
        run: |
          set -euo pipefail
          test "$(node -p "require('./package.json').version")" = "0.1.11"
          test -f package-lock.json
          test -f src/search-choices.js
          test -f test/search-choices-v0111.test.js
          test -f test/search-duration-v0111.test.js
          test -f test/search-identity-v0111.test.js
          test -f test/search-stage-filter-v0111.test.js
          grep -q 'resolveSearchChoices' src/commands.js
          grep -q 'shouldOfferSearchChoices' src/commands.js
          grep -q 'slice(0, 3)' src/search-picker.js
          grep -q 'bufferDurationMs: 2000' lavalink/application.yml
          grep -q 'frameBufferDurationMs: 20000' lavalink/application.yml
          grep -q 'nonAllocatingFrameBuffer: true' lavalink/application.yml
          grep -q -- '-Xmx256M' start-bot.bat
          grep -q -- '--max-old-space-size=128' start-bot.bat
          npm ci
          npm run check
          npm test

      - name: Build clean Windows install ZIP
        shell: bash
        run: |
          set -euo pipefail
          VERSION="v0.1.11"
          ROOT="dist/EZ-Music"
          mkdir -p "$ROOT/src" "$ROOT/lavalink"

          cp README.md package.json package-lock.json .env.example setup.bat start-bot.bat start-hidden.vbs stop-bot.bat install-autostart.bat install-autostart.ps1 remove-autostart.bat "$ROOT/"
          cp src/*.js "$ROOT/src/"
          cp lavalink/application.yml "$ROOT/lavalink/"

          cat > "$ROOT/CLEAN-INSTALL.txt" <<'EOF'
          EZ MUSIC v0.1.11 CLEAN WINDOWS INSTALL
          =====================================
          1. Stop EZ Music.
          2. Back up C:\EZ-Music\.env.
          3. If you want to preserve volume, favorites, history and crash/restart recovery,
             also back up C:\EZ-Music\data\ez-music.sqlite.
          4. Remove or rename the old C:\EZ-Music folder for a truly clean install.
          5. Extract this ZIP so the app lives at C:\EZ-Music.
          6. Restore your backed-up .env to C:\EZ-Music\.env.
          7. Restore data\ez-music.sqlite only if you intentionally backed it up.
          8. Run setup.bat.
          9. Test with start-bot.bat.
          10. When satisfied, use start-hidden.vbs; reinstall Task Scheduler only if needed.

          SMARTER TYPED SEARCH
          --------------------
          - Typed /play <song name> and /playnext <song name> now stay private and show up
            to 3 choices before anything is queued.
          - EZ Music searches YouTube with a lyrics bias, YouTube Music, and normal YouTube
            concurrently, then ranks and validates the combined candidates.
          - Plain song searches prefer Lyrics / Official Audio style uploads over M/V when
            they are good matches, while keeping M/V available as a choice when appropriate.
          - Direct YouTube, Spotify and SoundCloud URLs still resolve immediately without a
            picker. Explicit ytsearch:/ytmsearch:/scsearch: requests also remain immediate.
          - The picker rejects common wrong-result classes: unrelated same-title artists,
            cover/karaoke/instrumental/remix variants, stage/broadcast/fancam uploads,
            trailer/teaser/snippet/Shorts, obvious fan edits, and duration-incompatible
            full-album or short-form results. If only 2 trustworthy choices exist, it shows
            2 instead of padding the list with a bad third result.
          - Emergency SoundCloud fallback now strips YouTube presentation labels such as
            Color Coded Lyrics, Lyrics, Official Audio, Official Video and M/V so fallback
            lookup searches for the actual song.

          VERIFIED REAL SEARCH
          --------------------
          Production-profile Lavalink testing for "Heavy Serenade" returned:
          1. [Lyrics] NMIXX Heavy Serenade (Color Coded Lyrics) - 3:00
          2. [Audio]  NMIXX Heavy Serenade (Official Audio) - 3:01
          3. [M/V]    NMIXX Heavy Serenade M/V - 3:32

          STABILITY / MEMORY POLICY UNCHANGED
          -----------------------------------
          This release does not add DSP, another process, another Lavalink node, a cache
          service, background polling, or larger playback buffers/heaps. Lavalink remains
          capped at 256 MB Java heap and Node at 128 MB heap. Buffering remains 2s NAS / 20s
          frame buffer with nonAllocatingFrameBuffer enabled. Queue limits remain 300
          upcoming / 250 per playlist. SQLite remains the only persistence service.

          This package intentionally contains no .env, real secrets, SQLite database,
          node_modules, logs, or Lavalink.jar. setup.bat installs locked Node dependencies
          from package-lock.json and downloads/verifies Lavalink.jar. No Docker or WSL is
          required.
          EOF

          cd dist
          zip -r -9 "EZ-Music-${VERSION}-Windows-Clean.zip" EZ-Music >/dev/null
          sha256sum "EZ-Music-${VERSION}-Windows-Clean.zip" > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v0.1.11 >/dev/null 2>&1; then
            echo "Release v0.1.11 already exists; leaving it unchanged."
          else
            gh release create v0.1.11 \
              dist/EZ-Music-v0.1.11-Windows-Clean.zip \
              dist/SHA256SUMS.txt \
              --target 08f4cb102e72f3d77997b0a1b09840ded25e6774 \
              --title "EZ Music v0.1.11" \
              --notes "Smarter typed-song search release. Typed /play and /playnext requests now show up to three private, quality-ranked choices before anything is queued. EZ Music searches a YouTube lyrics-biased query, YouTube Music, and normal YouTube concurrently; Lyrics and Official Audio style uploads are preferred over M/V for plain song requests while good M/V results remain selectable. Result quality filtering now rejects unrelated same-title artists, cover/karaoke/instrumental/remix variants, stage/broadcast/fancam uploads, trailers/teasers/snippets/Shorts, obvious fan edits, and duration-incompatible full-album/short-form results, and the bot shows fewer than three choices rather than padding with a bad result. Direct YouTube/Spotify/SoundCloud links and explicit source queries remain immediate. Emergency SoundCloud fallback strips YouTube presentation labels before lookup. Real production-profile testing for Heavy Serenade returned NMIXX Lyrics (3:00), Official Audio (3:01), and M/V (3:32). PR #13, Windows CI, Ubuntu CI, and standalone Lavalink smoke testing passed. The 2s/20s buffer profile, non-allocating frame buffer, 256 MB Lavalink heap, 128 MB Node heap, one Node + one Lavalink architecture, SQLite persistence, queue caps, DSP-off policy, recovery and source protections are unchanged."
          fi

      - name: Remove merged feature branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin --delete feat/v0111-three-choice-search || true
