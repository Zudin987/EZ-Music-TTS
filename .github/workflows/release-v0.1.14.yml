name: Publish v0.1.14

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/release-v0.1.14.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PRODUCT_SHA: b0c5dc27d995d24aefa54b3ac7245cefe1264be6
      TAG: v0.1.14
      PACKAGE_DIR: EZ-Music-v0.1.14
      ZIP_NAME: EZ-Music-v0.1.14-Windows-Clean.zip
    steps:
      - name: Checkout exact tested product commit
        uses: actions/checkout@v6
        with:
          ref: b0c5dc27d995d24aefa54b3ac7245cefe1264be6
          fetch-depth: 1

      - name: Verify release source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PRODUCT_SHA"
          test "$(node -p "require('./package.json').version")" = "0.1.14"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; refusing to overwrite it."
            exit 1
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Build clean Windows package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist "$ZIP_NAME" SHA256SUMS.txt
          mkdir -p "dist/$PACKAGE_DIR"
          rsync -a ./ "dist/$PACKAGE_DIR/" \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.env' \
            --exclude='data/' \
            --exclude='node_modules/' \
            --exclude='dist/' \
            --exclude='logs/' \
            --exclude='*.log' \
            --exclude='*.sqlite' \
            --exclude='*.sqlite-*' \
            --exclude='*.pid' \
            --exclude='stop.requested' \
            --exclude='Lavalink.jar' \
            --exclude='lavalink/Lavalink.jar' \
            --exclude='lavalink/plugins/'

          cat > "dist/$PACKAGE_DIR/CLEAN-INSTALL.txt" <<'EOF'
          EZ Music v0.1.14 - Windows clean package
          =========================================

          Recommended clean upgrade:
          1. Stop the old bot with stop-bot.bat.
          2. Back up your existing .env.
          3. If you want to keep favorites/history/recovery, also back up data\ez-music.sqlite.
          4. Extract this ZIP to a clean folder (or replace the old program files after backing up the items above).
          5. Restore .env and, if wanted, data\ez-music.sqlite.
          6. Run setup.bat.
          7. Run start-bot.bat.

          Do not copy old node_modules, Lavalink.jar, plugin caches, logs, PID files, or stop.requested into the new install.

          v0.1.14 hardens Lavalink/Discord voice lifecycle handling while keeping the existing low-memory/raw-audio profile. No OAuth, remote poToken service, DSP, buffer increase, or heap increase is added.
          EOF

          forbidden="$(find "dist/$PACKAGE_DIR" -type f \( -name '.env' -o -name '*.sqlite' -o -name '*.sqlite-*' -o -name '*.pid' -o -name 'Lavalink.jar' -o -name '*.log' -o -name 'stop.requested' \) -print)"
          if [ -n "$forbidden" ]; then
            echo "Forbidden runtime files found in package:"
            echo "$forbidden"
            exit 1
          fi

          test -f "dist/$PACKAGE_DIR/setup.bat"
          test -f "dist/$PACKAGE_DIR/start-bot.bat"
          test -f "dist/$PACKAGE_DIR/package.json"
          test -f "dist/$PACKAGE_DIR/lavalink/application.yml"
          test -f "dist/$PACKAGE_DIR/CLEAN-INSTALL.txt"
          test "$(node -p "require('./dist/$PACKAGE_DIR/package.json').version")" = "0.1.14"

          (cd dist && zip -q -r -9 "../$ZIP_NAME" "$PACKAGE_DIR")
          sha256sum "$ZIP_NAME" > SHA256SUMS.txt
          cat SHA256SUMS.txt

          unzip -l "$ZIP_NAME" | tee /tmp/zip-list.txt >/dev/null
          if grep -E '(^|/)(\.env|ez-music\.sqlite|Lavalink\.jar|stop\.requested)$|node_modules/|\.log$' /tmp/zip-list.txt; then
            echo "Release ZIP contains a forbidden file."
            exit 1
          fi

      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat > release-notes.md <<'EOF'
          ## EZ Music v0.1.14

          Reliability hardening focused on Lavalink and Discord voice lifecycle failures rather than audio tuning.

          ### Fixed
          - Works around the Shoukaku 4.3.0 multi-attempt reconnect bug by using one library reconnect attempt at a time plus a bounded event-driven local-node replacement supervisor.
          - If Lavalink reconnects with a fresh server session, stale Kazagumo players are checkpointed to SQLite and retired instead of being reused as ghost players.
          - Discord voice WebSocket closures are handled explicitly: non-reconnectable close codes retire safely immediately, while transient closes receive a short recovery grace window.
          - Late TrackException/TrackStuck events are matched to the encoded Lavalink track, so an old event cannot skip or fallback a newer current song.
          - `/status` distinguishes Connected, Starting, Reconnecting, and Unavailable Lavalink states; new queue work is rejected while the local node is genuinely unavailable.

          ### Validation
          - Dedicated lifecycle verifier passed.
          - Full regression suite: 151/151 passed.
          - Pull-request CI passed on Ubuntu and Windows.
          - Standalone Lavalink + YouTube/LavaSrc smoke test passed.
          - Post-merge main CI passed on Ubuntu, Windows, and Lavalink smoke.

          ### Unchanged performance/audio profile
          - Single Node process + one local Lavalink process.
          - Java heap remains `-Xms64M -Xmx256M`.
          - Node heap cap remains `--max-old-space-size=128`.
          - Lavalink buffers remain 2s source / 20s frame with non-allocating frame buffer.
          - DSP remains disabled except normal volume.
          - No extra Lavalink node, service, dashboard, polling daemon, OAuth, or remote poToken/webpo service.

          The release ZIP is a clean Windows package: it intentionally excludes `.env`, SQLite data, `node_modules`, logs, Lavalink.jar, plugin caches, PID/runtime files, and other local state. Preserve your existing `.env` and optionally `data\ez-music.sqlite` before upgrading.
          EOF

          gh release create "$TAG" \
            "$ZIP_NAME" \
            SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "$PRODUCT_SHA" \
            --title "EZ Music v0.1.14" \
            --notes-file release-notes.md

      - name: Verify published tag and assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json tagName,targetCommitish,isDraft,isPrerelease,assets,url
          echo "### v0.1.14 SHA-256" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat SHA256SUMS.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
