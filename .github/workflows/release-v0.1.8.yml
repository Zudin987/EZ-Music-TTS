name: Publish EZ Music v0.1.8

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/release-v0.1.8.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: 4349c88c3234bbca7a0cf0999c531d5cedc2bcd5

      - name: Verify tested release source
        run: |
          set -euo pipefail
          test "$(node -p "require('./package.json').version")" = "0.1.8"
          test -f package-lock.json
          test -f src/source-routing.js
          test -f test/spotify-v018-status.test.js
          grep -q 'SPOTIFY_OEMBED_TIMEOUT_MS = 2_500' src/source-routing.js
          grep -q 'SPOTIFY_OEMBED_MAX_BYTES = 64 \* 1024' src/source-routing.js
          grep -q 'gc-warnings: true' lavalink/application.yml
          grep -q 'bufferDurationMs: 2000' lavalink/application.yml
          grep -q 'frameBufferDurationMs: 20000' lavalink/application.yml
          grep -q 'nonAllocatingFrameBuffer: true' lavalink/application.yml
          grep -q -- '-Xmx256M' start-bot.bat
          grep -q -- '--max-old-space-size=128' start-bot.bat

      - name: Build clean Windows install ZIP
        run: |
          set -euo pipefail
          VERSION="v0.1.8"
          ROOT="dist/EZ-Music"
          mkdir -p "$ROOT/src" "$ROOT/lavalink"
          cp README.md package.json package-lock.json .env.example setup.bat start-bot.bat start-hidden.vbs stop-bot.bat install-autostart.bat install-autostart.ps1 remove-autostart.bat "$ROOT/"
          cp src/*.js "$ROOT/src/"
          cp lavalink/application.yml "$ROOT/lavalink/"
          cat > "$ROOT/CLEAN-INSTALL.txt" <<'EOF'
          EZ MUSIC v0.1.8 CLEAN WINDOWS INSTALL
          ====================================
          1. Stop EZ Music.
          2. Back up C:\EZ-Music\.env.
          3. To preserve volume, favorites, history and crash/restart recovery,
             also back up C:\EZ-Music\data\ez-music.sqlite.
          4. Remove or rename the old C:\EZ-Music folder for a truly clean install.
          5. Extract this ZIP so the app lives at C:\EZ-Music.
          6. Restore your backed-up .env to C:\EZ-Music\.env.
          7. Restore data\ez-music.sqlite if you intentionally backed it up.
          8. Run setup.bat. Dependencies are installed from package-lock.json with npm ci.
          9. Test with start-bot.bat.
          10. When satisfied, use start-hidden.vbs; reinstall Task Scheduler only if needed.

          v0.1.8 SPOTIFY TRACK FALLBACK
          -----------------------------
          - Single Spotify track links can use Spotify's official oEmbed metadata endpoint,
            then the existing YTM -> YouTube search/audio path.
          - SPOTIFY_CLIENT_ID / SPOTIFY_CLIENT_SECRET are not needed for that track fallback.
          - If working LavaSrc Spotify credentials are present, direct track mirroring is tried
            first and a failed/empty track lookup can fall back automatically.
          - spotify.link short links are canonicalized through oEmbed.
          - Spotify albums/playlists still require the normal LavaSrc Spotify integration,
            because oEmbed does not expose a track list.
          - oEmbed lookup is bounded to 2.5 seconds and 64 KiB with no retries or extra service.

          PLAYBACK AUDIT / MEMORY POLICY
          ------------------------------
          - Lavalink GC-pause warnings are enabled as a lightweight stutter diagnostic.
          - Audio behavior is otherwise unchanged: 2s NAS / 20s frame buffer,
            nonAllocatingFrameBuffer enabled, max 256 MB Java heap, Node max 128 MB heap.
          - YouTube client order remains MUSIC, ANDROID_VR, WEB, WEBEMBEDDED.
          - DSP remains disabled except volume. Queue limits remain 300 upcoming / 250 per playlist.
          - No extra process, dashboard, cache service, transcoder, or polling worker was added.

          This package intentionally contains no .env, real secrets, SQLite database,
          node_modules, logs, Lavalink.jar, or runtime plugin files.
          EOF
          cd dist
          zip -r -9 "EZ-Music-${VERSION}-Windows-Clean.zip" EZ-Music >/dev/null
          sha256sum "EZ-Music-${VERSION}-Windows-Clean.zip" > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create v0.1.8 \
            dist/EZ-Music-v0.1.8-Windows-Clean.zip \
            dist/SHA256SUMS.txt \
            --target 4349c88c3234bbca7a0cf0999c531d5cedc2bcd5 \
            --title "EZ Music v0.1.8" \
            --notes "Spotify single-track links now have a lightweight official oEmbed metadata fallback into the existing YTM/YouTube audio path. Working LavaSrc Spotify credentials are still preferred when present; failed/empty track lookups fall back automatically, and spotify.link short URLs are canonicalized through oEmbed. Albums/playlists remain on the normal Spotify integration because oEmbed has no tracklist. oEmbed requests are bounded to 2.5 seconds and 64 KiB with no retries, cache, extra dependency, or process. The playback audit also enables Lavalink GC-pause warnings for stutter diagnosis while deliberately keeping the tested youtube-source snapshot/client order, 2s/20s buffers, 256 MB Java heap, 128 MB Node heap, DSP-off policy and queue limits unchanged. PR #10 passed Windows, Ubuntu and live Lavalink/YTM/YouTube CI; pre-PR verification also passed 89 tests plus a live Spotify oEmbed request."

      - name: Remove merged feature branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin --delete feat/v018-spotify-oembed-performance || true
