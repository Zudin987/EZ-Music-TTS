name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  node:
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22.9.0'
          package-manager-cache: false
      - run: npm install
      - run: npm run check
      - run: npm test

  lavalink-smoke:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Start Lavalink
        run: docker compose up -d
      - name: Wait for Lavalink API
        shell: bash
        run: |
          for attempt in {1..90}; do
            if curl -fsS -H 'Authorization: ezmusic-local-only' http://127.0.0.1:2333/version; then
              echo
              echo 'Lavalink is ready.'
              exit 0
            fi
            sleep 2
          done
          echo 'Lavalink did not become ready in time.' >&2
          docker compose logs --no-color lavalink >&2 || true
          exit 1
      - name: Verify YouTube source plugin
        shell: bash
        run: |
          curl -fsS -H 'Authorization: ezmusic-local-only' http://127.0.0.1:2333/v4/info > /tmp/lavalink-info.json
          python3 - <<'PY'
          import json
          with open('/tmp/lavalink-info.json', encoding='utf-8') as f:
              info = json.load(f)
          plugins = [str(item.get('name', '')).lower() for item in info.get('plugins', [])]
          sources = [str(item).lower() for item in info.get('sourceManagers', [])]
          assert any('youtube' in name for name in plugins), f'YouTube plugin missing: {plugins}'
          assert any('youtube' in name for name in sources), f'YouTube source manager missing: {sources}'
          print('YouTube plugin/source manager loaded.')
          PY
      - name: Show Lavalink logs on failure
        if: failure()
        run: docker compose logs --no-color lavalink
      - name: Stop Lavalink
        if: always()
        run: docker compose down -v
