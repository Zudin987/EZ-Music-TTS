name: Verify v0.1.10 SoundCloud fallback

on:
  push:
    branches:
      - fix/v0110-search-playback-fallback
    paths:
      - .github/workflows/v0110-refine-soundcloud.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/v0110-search-playback-fallback
      - uses: actions/setup-node@v6
        with:
          node-version: 22.14.0
          package-manager-cache: false
      - name: Apply SoundCloud fallback refinement
        run: |
          node scripts/refine-v0110-soundcloud.mjs
          node scripts/fix-v0110-soundcloud-tests.mjs
      - name: Locked clean install
        run: npm ci
      - name: Syntax checks
        run: npm run check
      - name: Full regression suite
        run: npm test
      - name: Preserve low-memory playback profile
        run: |
          grep -q 'soundcloud: true' lavalink/application.yml
          grep -q 'bufferDurationMs: 2000' lavalink/application.yml
          grep -q 'frameBufferDurationMs: 20000' lavalink/application.yml
          grep -q 'nonAllocatingFrameBuffer: true' lavalink/application.yml
          grep -q -- '-Xmx256M' start-bot.bat
          grep -q -- '--max-old-space-size=128' start-bot.bat
      - name: Commit verified product refinement
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md lavalink/application.yml src/music.js src/playback-fallback.js \
            test/performance-v016.test.js test/search-playback-v0110.test.js
          git commit -m "fix: fail over blocked YouTube playback to SoundCloud"
          git push origin HEAD:fix/v0110-search-playback-fallback
