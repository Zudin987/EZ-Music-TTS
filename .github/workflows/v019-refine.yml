name: Verify v0.1.9 refinements

on:
  push:
    branches:
      - fix/v019-search-start-nowplaying
    paths:
      - .github/workflows/v019-refine.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/v019-search-start-nowplaying
      - uses: actions/setup-node@v6
        with:
          node-version: 22.14.0
      - name: Apply audited refinements
        run: node scripts/refine-v019.mjs
      - name: Locked clean install
        run: npm ci
      - name: Syntax checks
        run: npm run check
      - name: Full regression suite
        run: npm test
      - name: Preserve playback profile invariants
        run: |
          grep -q 'bufferDurationMs: 2000' lavalink/application.yml
          grep -q 'frameBufferDurationMs: 20000' lavalink/application.yml
          grep -q 'nonAllocatingFrameBuffer: true' lavalink/application.yml
          grep -q -- '-Xmx256M' start-bot.bat
          grep -q -- '--max-old-space-size=128' start-bot.bat
      - name: Commit verified refinements
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/commands.js test/search-playback-v019.test.js
          git commit -m "fix: clarify starts and queued-idle diagnostics"
          git push origin HEAD:fix/v019-search-start-nowplaying
