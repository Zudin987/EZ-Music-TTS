name: Temporary v0.1.15 finalizer

on:
  push:
    branches: [audit/v0.1.15-deep-reliability]

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: audit/v0.1.15-deep-reliability
      - uses: actions/setup-node@v6
        with:
          node-version: '22.14.0'
          package-manager-cache: false
      - name: Make historical regression tests release-number agnostic
        shell: python
        run: |
          from pathlib import Path

          files = [
              'test/lavalink-lifecycle-v0114.test.js',
              'test/playback-fallback-v0113.test.js',
              'test/search-choices-v0111.test.js',
              'test/source-routing.test.js',
          ]
          old = "  assert.equal(pkg.version, '0.1.14');\n"
          new = "  assert.match(pkg.version, /^0\\.1\\.\\d+$/);\n"
          for name in files:
              path = Path(name)
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{name}: expected one stale version assertion, found {count}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')
      - name: Set release version
        run: npm version 0.1.15 --no-git-tag-version
      - run: npm ci
      - run: node -e "import('./src/storage.js').then(({ closeStorage }) => closeStorage())"
      - run: npm run check
      - run: npm test
      - name: Commit release metadata and durable tests
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json test/lavalink-lifecycle-v0114.test.js test/playback-fallback-v0113.test.js test/search-choices-v0111.test.js test/source-routing.test.js
          git commit -m 'chore: prepare v0.1.15'
          git push origin HEAD:audit/v0.1.15-deep-reliability
