name: Temporary v0.1.15 finalizer

on:
  push:
    branches: [audit/v0.1.15-deep-reliability]

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: audit/v0.1.15-deep-reliability
      - uses: actions/setup-node@v6
        with:
          node-version: '22.14.0'
          package-manager-cache: false
      - name: Set release version
        run: npm version 0.1.15 --no-git-tag-version
      - run: npm ci
      - run: node -e "import('./src/storage.js').then(({ closeStorage }) => closeStorage())"
      - run: npm run check
      - run: npm test
      - name: Commit release metadata
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          git commit -m 'chore: prepare v0.1.15'
          git push origin HEAD:audit/v0.1.15-deep-reliability
