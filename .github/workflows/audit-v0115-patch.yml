name: Temporary v0.1.15 performance and reliability patch

on:
  push:
    branches: [audit/v0.1.15-deep-reliability]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: audit/v0.1.15-deep-reliability
      - uses: actions/setup-node@v6
        with:
          node-version: '22.14.0'
          package-manager-cache: false
      - name: Apply low-risk performance and shutdown hardening
        shell: python
        run: |
          from pathlib import Path
          import json
          import textwrap

          def replace_required(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 anchor, found {count}')
              return text.replace(old, new, 1)

          storage_path = Path('src/storage.js')
          storage = storage_path.read_text(encoding='utf-8')
          storage = replace_required(
              storage,
              "db.pragma('journal_mode = WAL');\ndb.pragma('foreign_keys = ON');",
              "db.pragma('journal_mode = WAL');\n// WAL + NORMAL keeps metadata writes fast while preserving database integrity.\n// A sudden power loss may lose the newest transaction, which is acceptable for\n// disposable history/recovery metadata and avoids FULL-mode fsync overhead.\ndb.pragma('synchronous = NORMAL');\ndb.pragma('foreign_keys = ON');",
              'sqlite synchronous mode',
          )
          storage_path.write_text(storage, encoding='utf-8')

          lavalink_path = Path('lavalink/application.yml')
          lavalink = lavalink_path.read_text(encoding='utf-8')
          lavalink = replace_required(
              lavalink,
              "    youtubePlaylistLoadLimit: 3\n    # Diagnostic only:",
              "    youtubePlaylistLoadLimit: 3\n    # SoundCloud is the emergency audio fallback. Preview-only entries cannot\n    # satisfy a full-song retry, so filter them before they can enter selection.\n    soundcloudFilterOutPreviewTracks: true\n    # Diagnostic only:",
              'soundcloud preview filter',
          )
          lavalink_path.write_text(lavalink, encoding='utf-8')

          stop_path = Path('stop-bot.bat')
          stop = stop_path.read_text(encoding='utf-8')
          stop = replace_required(
              stop,
              "for($i=0;$i -lt 20;$i++){Start-Sleep -Milliseconds 250;",
              "for($i=0;$i -lt 100;$i++){Start-Sleep -Milliseconds 250;",
              'graceful stop window',
          )
          stop_path.write_text(stop, encoding='utf-8')

          package_path = Path('package.json')
          package = json.loads(package_path.read_text(encoding='utf-8'))
          check = package['scripts']['check']
          if 'src/config.js' not in check:
              check = check.replace('node --check src/index.js', 'node --check src/index.js && node --check src/config.js')
          if 'src/player-control.js' not in check:
              check = check.replace('node --check src/playback-start.js', 'node --check src/playback-start.js && node --check src/player-control.js')
          package['scripts']['check'] = check
          package_path.write_text(json.dumps(package, indent=2) + '\n', encoding='utf-8')

          test_path = Path('test/performance-reliability-v0115.test.js')
          test_path.write_text(textwrap.dedent("""\
          import test from 'node:test';
          import assert from 'node:assert/strict';
          import fs from 'node:fs';

          test('SQLite metadata writes use WAL plus NORMAL synchronous mode', () => {
            const source = fs.readFileSync('src/storage.js', 'utf8');
            assert.match(source, /journal_mode = WAL/);
            assert.match(source, /synchronous = NORMAL/);
          });

          test('syntax check covers configuration and awaited transport control modules', () => {
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            assert.match(pkg.scripts.check, /src\\/config\\.js/);
            assert.match(pkg.scripts.check, /src\\/player-control\\.js/);
          });

          test('SoundCloud fallback excludes preview-only tracks', () => {
            const config = fs.readFileSync('lavalink/application.yml', 'utf8');
            assert.match(config, /soundcloudFilterOutPreviewTracks:\\s*true/);
          });

          test('Windows graceful shutdown can outlast the 20 second Lavalink REST timeout', () => {
            const stop = fs.readFileSync('stop-bot.bat', 'utf8');
            const music = fs.readFileSync('src/music.js', 'utf8');
            assert.match(stop, /for\\(\\$i=0;\\$i -lt 100;\\$i\\+\\+\\)\\{Start-Sleep -Milliseconds 250;/);
            assert.match(music, /restTimeout:\\s*20_000/);
          });
          """), encoding='utf-8')
      - name: Upgrade SQLite binding to current N-API release
        run: npm install --save-exact better-sqlite3@13.0.3
      - name: Verify clean locked install
        shell: bash
        run: |
          rm -rf node_modules
          npm ci
      - name: Smoke-test SQLite storage
        run: node -e "import('./src/storage.js').then(({ closeStorage }) => closeStorage())"
      - run: npm run check
      - run: npm test
      - name: Commit product patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json src/storage.js lavalink/application.yml stop-bot.bat test/performance-reliability-v0115.test.js
          git commit -m 'perf: harden storage fallback and graceful shutdown'
          git push origin HEAD:audit/v0.1.15-deep-reliability
