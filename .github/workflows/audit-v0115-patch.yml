name: Temporary v0.1.15 voice transition patch

on:
  push:
    branches: [audit/v0.1.15-deep-reliability]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: audit/v0.1.15-deep-reliability
      - uses: actions/setup-node@v6
        with:
          node-version: '22.14.0'
          package-manager-cache: false
      - name: Apply Discord voice transition hardening
        shell: python
        run: |
          from pathlib import Path

          def replace_required(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 anchor, found {count}')
              return text.replace(old, new, 1)

          path = Path('src/music.js')
          text = path.read_text(encoding='utf-8')
          text = replace_required(
              text,
              "import { nodeReconnectDelayMs, resolveLifecycleEventTrack, voiceCloseDisposition, VOICE_CLOSE_RECOVERY_GRACE_MS } from './lavalink-lifecycle.js';",
              "import { nodeReconnectDelayMs, resolveLifecycleEventTrack, voiceChannelTransition, voiceCloseDisposition, VOICE_CLOSE_RECOVERY_GRACE_MS } from './lavalink-lifecycle.js';",
              'lifecycle import',
          )
          old = "  client.on('voiceStateUpdate', (oldState, newState) => {\n    const guildId = newState.guild?.id || oldState.guild?.id;\n    const player = guildId ? music.players.get(guildId) : null;\n    if (!player) return;\n    const voiceId = player.voiceId || voiceIds.get(guildId);\n    if (!voiceId || (oldState.channelId !== voiceId && newState.channelId !== voiceId)) return;\n    void evaluateVoiceOccupancy(player).catch((error) => console.warn('[voice] occupancy evaluation failed', error?.message || error));\n  });"
          new = "  client.on('voiceStateUpdate', (oldState, newState) => {\n    const guildId = newState.guild?.id || oldState.guild?.id;\n    const player = guildId ? music.players.get(guildId) : null;\n    if (!player) return;\n\n    // Shoukaku consumes raw VOICE_STATE_UPDATE packets and follows external bot\n    // moves, but Kazagumo's wrapper voiceId is not updated by that path. Keep EZ's\n    // wrapper/cache synchronized with the state Discord already accepted instead\n    // of sending a second move request back to Discord.\n    if (oldState.id === client.user?.id) {\n      const botTransition = voiceChannelTransition(oldState.channelId, newState.channelId);\n      if (botTransition.kind === 'left') {\n        void retirePlayerForTransportLoss(player, 'Discord moved bot out of voice').catch((error) => {\n          console.warn('[voice] external disconnect cleanup failed', error?.message || error);\n        });\n        return;\n      }\n      if (botTransition.kind === 'moved' || botTransition.kind === 'joined') {\n        const previousVoiceId = botTransition.from;\n        player.voiceId = botTransition.to;\n        voiceIds.set(guildId, botTransition.to);\n        clearVoiceCloseRecoveryTimer(guildId);\n        scheduleRecoverySave(player, 0);\n\n        if (previousVoiceId && previousVoiceId !== botTransition.to) {\n          void client.rest.put(`/channels/${previousVoiceId}/voice-status`, { body: { status: null } }).catch(() => {});\n        }\n        if (player.queue.current) void setVoiceStatus(player, player.queue.current);\n        void evaluateVoiceOccupancy(player).catch((error) => console.warn('[voice] occupancy evaluation failed', error?.message || error));\n        return;\n      }\n    }\n\n    const voiceId = player.voiceId || voiceIds.get(guildId);\n    if (!voiceId || (oldState.channelId !== voiceId && newState.channelId !== voiceId)) return;\n    void evaluateVoiceOccupancy(player).catch((error) => console.warn('[voice] occupancy evaluation failed', error?.message || error));\n  });"
          text = replace_required(text, old, new, 'voice state handler')
          path.write_text(text, encoding='utf-8')
      - run: npm ci
      - run: npm run check
      - run: npm test
      - name: Commit product patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/music.js
          git commit -m 'fix: synchronize externally moved Discord voice state'
          git push origin HEAD:audit/v0.1.15-deep-reliability
