server:
  port: 2333
  # Native Windows setup: never expose Lavalink to the LAN.
  address: 127.0.0.1

lavalink:
  plugins:
    # 1.18.2 predates YouTube client breakages from 2026-08-18/19.
    # Pin the upstream snapshot after the Android/iOS/TV playback fixes, but
    # before the later experimental itag-18 length change.
    - dependency: "dev.lavalink.youtube:youtube-plugin:b33460b38ad13b5cd07da75e46444397cf0ea2df"
      snapshot: true
  server:
    password: "ezmusic-local-only"
    sources:
      youtube: false
      bandcamp: true
      soundcloud: true
      twitch: false
      vimeo: false
      nico: false
      http: true
      local: false
    # Raw-song policy: volume is the only enabled audio control.
    filters:
      volume: true
      equalizer: false
      karaoke: false
      timescale: false
      tremolo: false
      vibrato: false
      distortion: false
      rotation: false
      channelMix: false
      lowPass: false

plugins:
  youtube:
    enabled: true
    allowSearch: true
    allowDirectVideoIds: true
    allowDirectPlaylistIds: true
    # MUSIC is search-only. ANDROID and IOS include upstream fixes from
    # 2026-08-18/19; the rest remain anonymous fallbacks.
    clients:
      - MUSIC
      - ANDROID
      - IOS
      - TVHTML5_SIMPLY
      - ANDROID_MUSIC
      - ANDROID_VR
      - MWEB
      - WEB
      - WEBEMBEDDED

logging:
  level:
    root: INFO
    lavalink: INFO
