server:
  port: 2333
  # Native Windows setup: never expose Lavalink to the LAN.
  address: 127.0.0.1

lavalink:
  plugins:
    # youtube-source 1.18.2 predates YouTube playback changes from 2026-08-18/19.
    # Pin the latest upstream fix snapshot currently used by this bot.
    - dependency: "dev.lavalink.youtube:youtube-plugin:f45bbb7aebfcbc1c553769e04af6cd43afa8b7c3"
      snapshot: true
    - dependency: "com.github.topi314.lavasrc:lavasrc-plugin:4.8.3"
      repository: "https://maven.lavalink.dev/releases"
      snapshot: false
  server:
    password: "ezmusic-local-only"
    sources:
      youtube: false
      bandcamp: true
      soundcloud: true
      twitch: false
      vimeo: false
      nico: false
      # Generic HTTP playback is disabled: private Discord users should not be
      # able to make Lavalink fetch arbitrary URLs from the host/LAN.
      http: false
      local: false
    # Raw-song policy: volume is the only enabled audio control.
    filters:
      volume: true
      equalizer: false
      karaoke: false
      timescale: false
      tremolo: false
      vibrato: false
      distortion: false
      rotation: false
      channelMix: false
      lowPass: false

    # Stability profile for a single private bot. These are buffering controls,
    # not DSP/audio effects: they do not alter pitch, speed, EQ, or the source.
    # More headroom helps absorb short source/network/GC hiccups at track start.
    nonAllocatingFrameBuffer: true
    bufferDurationMs: 2000
    frameBufferDurationMs: 20000
    trackStuckThresholdMs: 10000
    # 3 pages x ~100 tracks keeps huge YouTube playlists from creating large
    # transient responses on a machine with a strict RAM budget.
    youtubePlaylistLoadLimit: 3
    # SoundCloud is the emergency audio fallback when anonymous YouTube
    # playback is blocked. Never surface subscription-only preview tracks as if
    # they were a full-song fallback. This is filtering only, not audio DSP.
    soundcloudFilterOutPreviewTracks: true
    # Diagnostic only: report unusually long JVM GC pauses so they can be
    # correlated with frame starvation without adding another monitor/service.
    gc-warnings: true

plugins:
  lavasrc:
    # Spotify is metadata-only/mirrored. It is enabled at launch only when both
    # SPOTIFY_CLIENT_ID and SPOTIFY_CLIENT_SECRET exist in .env.
    providers:
      - 'ytmsearch:"%ISRC%"'
      - 'ytmsearch:%QUERY%'
      - 'ytsearch:"%ISRC%"'
      - 'ytsearch:%QUERY%'
    sources:
      spotify: ${SPOTIFY_ENABLED:false}
      applemusic: false
      deezer: false
      yandexmusic: false
      flowerytts: false
      youtube: false
      vkmusic: false
      tidal: false
      qobuz: false
      ytdlp: false
      jiosaavn: false
    lyrics-sources:
      spotify: false
      deezer: false
      youtube: false
      yandexmusic: false
      vkmusic: false
      lrcLib: false
    spotify:
      clientId: "${SPOTIFY_CLIENT_ID:}"
      clientSecret: "${SPOTIFY_CLIENT_SECRET:}"
      countryCode: "${SPOTIFY_COUNTRY_CODE:MY}"
      # Keep source responses bounded to the bot's own 300-upcoming queue ceiling.
      playlistLoadLimit: 3
      albumLoadLimit: 2
      resolveArtistsInSearch: false
      localFiles: false
      preferPartnerApi: false

  youtube:
    enabled: true
    allowSearch: true
    allowDirectVideoIds: true
    allowDirectPlaylistIds: true
    # Keep the upstream recommended short chain. Current YouTube login/SABR
    # blocking can still make all credential-free playback clients fail; EZ Music
    # handles that at runtime with a relevance-checked SoundCloud audio fallback
    # instead of adding OAuth, poToken services, transcoding, or more failed clients.
    clients:
      - MUSIC
      - ANDROID_VR
      - WEB
      - WEBEMBEDDED

logging:
  level:
    root: INFO
    lavalink: INFO
  # Local private node: REST request logs add noise and allocations without
  # helping normal operation. Re-enable temporarily only while debugging.
  request:
    enabled: false
